services:
  orders:
    image: courier-dispatch-orders:local
    build:
      context: .
      dockerfile: src/Orders/Orders.Api/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Orders: Host=orders-db;Port=5432;Database=orders;Username=orders;Password=orders
      Dispatch__Address: http://dispatch:8080
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: courier
      RabbitMq__Password: courier
    ports:
      - "127.0.0.1:${ORDERS_PORT:-5100}:8080"
    depends_on:
      orders-db:
        condition: service_healthy
      orders-migrate:
        condition: service_completed_successfully
      dispatch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  orders-migrate:
    image: courier-dispatch-orders-migrations:local
    build:
      context: .
      dockerfile: src/Orders/Orders.Api/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__Orders: Host=orders-db;Port=5432;Database=orders;Username=orders;Password=orders
      Dispatch__Address: http://dispatch:8080
    depends_on:
      orders-db:
        condition: service_healthy
    restart: "no"

  dispatch:
    image: courier-dispatch-dispatch:local
    build:
      context: .
      dockerfile: src/Dispatch/Dispatch.Api/Dockerfile
      target: final
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Dispatch: Host=dispatch-db;Port=5432;Database=dispatch;Username=dispatch;Password=dispatch
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: courier
      RabbitMq__Password: courier
    depends_on:
      dispatch-db:
        condition: service_healthy
      dispatch-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DISPATCH_PORT:-5200}:8080"
    healthcheck:
      test: ["CMD", "curl", "--http2-prior-knowledge", "--fail", "--silent", "--show-error", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

  dispatch-migrate:
    image: courier-dispatch-dispatch-migrations:local
    build:
      context: .
      dockerfile: src/Dispatch/Dispatch.Api/Dockerfile
      target: migrations
    environment:
      ConnectionStrings__Dispatch: Host=dispatch-db;Port=5432;Database=dispatch;Username=dispatch;Password=dispatch
    depends_on:
      dispatch-db:
        condition: service_healthy
    restart: "no"

  dispatch-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dispatch
      POSTGRES_PASSWORD: dispatch
      POSTGRES_DB: dispatch
    ports:
      - "127.0.0.1:${DISPATCH_POSTGRES_PORT:-5434}:5432"
    volumes:
      - dispatch-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dispatch"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  orders-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - orders-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: courier
      RABBITMQ_DEFAULT_PASS: courier
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:19092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  orders-db-data:
  dispatch-db-data:
  rabbitmq-data:
  kafka-data:
  redis-data:
